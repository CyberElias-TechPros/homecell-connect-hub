name: Deploy backend

# Deploys the homecell-api worker on push to main (calm-disk account).
# Applies outstanding D1 migrations (worker/migrations/*.sql) before every
# deploy, so new migration files ship automatically with the code that needs
# them.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (calm-disk account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply homecell-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://homecell-api.calm-disk-8311.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true' || {
            echo "::error::homecell-api health check failed"; exit 1; }
