#:schema node_modules/wrangler/config-schema.json
#
# Cloudflare Worker API for Homecell Connect Hub.
#
# Local development:  npx wrangler dev --port 8787 --local
# Apply migrations:   npx wrangler d1 migrations apply homecell-db --local
#
# Production deployment values (database_id, kv id, r2 name, secrets) are
# supplied by your own Cloudflare account — see docs/DEPLOYMENT.md.

name = "homecell-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 — relational data
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "homecell-db"
# Replace with the id returned by `wrangler d1 create homecell-db` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV — cached public config / rate limits / feature flags
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

# ---------------------------------------------------------------------------
# R2 — uploaded materials, avatars, report exports
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "homecell-storage"

[vars]
ENVIRONMENT = "development"
# Comma-separated list of origins allowed to call the API with credentials.
# In local dev the Vite dev server proxies /api, so same-origin applies.
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:5173"
# When secrets are absent the app falls back to logging outbound messages.
MESSAGING_DRIVER = "log"

[observability]
enabled = true
