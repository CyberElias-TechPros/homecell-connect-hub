#:schema node_modules/wrangler/config-schema.json
#
# Cloudflare Worker API for Homecell Connect Hub.
#
# Local development:  npx wrangler dev --port 8787 --local
# Apply migrations:   npx wrangler d1 migrations apply homecell-db --local
#
# Production deployment values (database_id, kv id, r2 name, secrets) are
# supplied by your own Cloudflare account — see docs/DEPLOYMENT.md.

name = "homecell-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 — relational data
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "homecell-db"
# Cloudflare account: Pain (ba3a0c06ca86c6e61d2c6b0350abb80b)
database_id = "4e4bdc6e-b41a-43d8-b9da-8d498a52f23b"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV — cached public config / rate limits / feature flags
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "dc845a7a301440f59890b208456c0a33"
preview_id = "dc845a7a301440f59890b208456c0a33"

# ---------------------------------------------------------------------------
# R2 — uploaded materials, avatars, report exports
# ---------------------------------------------------------------------------
# No bucket is bound yet: R2 is not enabled on this account and the Worker does
# not currently read STORAGE anywhere, so uploads stay unavailable until a bucket
# exists. Re-add the block below once R2 is activated.
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "homecell-storage"

[vars]
ENVIRONMENT = "production"
# Comma-separated list of origins allowed to call the API with credentials.
ALLOWED_ORIGINS = "https://homecell-connect-hub.vercel.app,http://localhost:8080,http://localhost:5173"
# When secrets are absent the app falls back to logging outbound messages.
MESSAGING_DRIVER = "log"

[observability]
enabled = true
